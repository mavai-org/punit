kotlin.stdlib.default.dependency=false
punitVersion=0.15.2-SNAPSHOT

# The mavai-R release whose conformance cases and interchange schemas the
# build fetches. Moved deliberately, one release at a time; override for a
# single build with -PmavaiRTag=vX.Y.Z.
mavaiRTag=v0.14.0
# The mavai-R release whose declarative-format corpus punit-decl is held to.
# It trails mavaiRTag while the run-controls and built-in-stepper amendments
# of mavai-services/1 (mavai-R 0.13.0) are not yet implemented by the
# declarative reader; 0.14.0 changes no format. Override with
# -PmavaiRFormatsTag=vX.Y.Z.
mavaiRFormatsTag=v0.12.0
