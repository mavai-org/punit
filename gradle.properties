kotlin.stdlib.default.dependency=false
punitVersion=0.16.2-SNAPSHOT

# The mavai-R release whose conformance cases and interchange schemas the
# build fetches. Moved deliberately, one release at a time; override for a
# single build with -PmavaiRTag=vX.Y.Z.
mavaiRTag=v0.16.2
# The mavai-R release whose declarative-format corpus punit-decl is held to.
# v0.16.1 brings the zero-failures criteria of mavai-contract/1, which
# punit-decl implements; the run-controls and built-in-stepper amendments of
# mavai-services/1 (mavai-R 0.13.0), not yet implemented, are declared
# exemptions in FormatConformanceTest, never silent. Override
# with -PmavaiRFormatsTag=vX.Y.Z.
mavaiRFormatsTag=v0.16.1
