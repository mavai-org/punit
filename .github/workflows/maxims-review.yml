name: Maxims review

# Advisory architect review of every PR against the project's software-development
# maxims. The maxims text and the reviewer persona are fetched at run time from a
# private source repo — they are not in this public tree. See the orchestrator
# directive DIR-PU-QA-review-agents for the design.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  architect:
    # Skip on fork PRs: secrets (and thus the private maxims source) are withheld
    # from forked pull_request runs. Same-repo branch PRs only. Likewise skip
    # Dependabot-triggered runs: they see only the Dependabot secrets store, so
    # the checkout token resolves empty — and a maxims review of a version-bump
    # diff has no value anyway.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout the PR under review
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch the private QA source (maxims + persona)
        uses: actions/checkout@v7
        with:
          repository: mavai-org/mavai-orchestrator
          token: ${{ secrets.MAXIMS_SOURCE_TOKEN }}
          path: .qa-source
          sparse-checkout: |
            .claude-submodules/punit-MAXIMS.md
            plan/qa/punit
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Architect maxims review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # With a prompt the action runs unattended, and any shell command not
          # allowed here is refused without failing the step. The shallow
          # checkout cannot diff against the base, so the reviewer reads the PR
          # through gh and posts its review as a comment. gh pr review is not
          # allowed: it can approve.
          claude_args: >-
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          prompt: |
            Read .qa-source/plan/qa/punit/maxims-review-persona.md and follow it
            exactly. The maxims it refers to are in
            .qa-source/.claude-submodules/punit-MAXIMS.md. Review pull
            request ${{ github.repository }}#${{ github.event.pull_request.number }}
            (its diff only) and post a single advisory review as one PR comment
            with gh pr comment. Do not print the
            maxims file or the persona file into your review or the job log.

      # A refused tool leaves the step green and the review unposted. Name any
      # refusals in the log — tool and command only; the full execution output
      # holds the private QA source and is never uploaded.
      - name: Report refused tools
        if: always()
        run: |
          out="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$out" ] || { echo "no execution output"; exit 0; }
          jq -r '.[] | select(.type == "result") | .permission_denials[]?
                 | "refused: \(.tool_name) \(.tool_input.command // "" | .[0:120])"' "$out"
